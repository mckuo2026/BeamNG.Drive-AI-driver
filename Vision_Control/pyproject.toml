[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beamng-horizon-driver"
version = "1.0.0"
description = "Window-based visual driving assistant for BeamNG.drive and Horizon-style racing games."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "MC Kuo"}]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: Microsoft :: Windows",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "dxcam>=0.0.5",
    "pywin32>=306",
    "onnxruntime-directml>=1.17.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "vgamepad>=0.0.8",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
beamng-horizon-driver = "vision_control.main:main"
vision-control = "vision_control.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
extend-select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/vision_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "smoke: fast smoke-level unit tests",
]
